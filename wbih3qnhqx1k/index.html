<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>エアコンクリーニングのご予約｜クリーニングBASE</title>
<!--
  クリーニングBASE（松本さん）のペライチLP → この会話型ページ → 予約フォーム（GAS）。
  ありがとうエアコンの予約チャット（arigatou-booking/welcome）と同じ流れ：
  最初に「はい／いいえ」→ お伺いの一言 → 予約フォームへ。
  ※予約フォームのGASは他ページへの埋め込みを許していない（2026-11-24確認）ので、ボタンで同じ画面のままフォームへ移る。
  住所は推測できない文字列（連番にしない）。
-->
<style>
  :root {
    --chat-bg: #8fa9d1; --bubble-in: #fff; --bubble-out: #8de055;
    --text: #1f2328; --muted: #5b6470; --accent: #06c755; --accent-dark: #05a647; --line: #e3e6ea;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--text); background: var(--chat-bg); font-size: 18px; line-height: 1.6; min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #2b3a55; color: #fff; padding: 10px 16px;
  }
  header .name { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .reset { border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; }
  .chat { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: flex-end; gap: 8px; animation: pop .35s ease-out both; }
  .row.out { justify-content: flex-end; }
  .avatar { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    font-size: 11px; font-weight: 800; color: #2b3a55; letter-spacing: -.5px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; background: var(--bubble-in); box-shadow: 0 1px 1px rgba(0,0,0,.08); word-break: break-word; }
  .row.in .bubble { border-top-left-radius: 4px; }
  .row.out .bubble { background: var(--bubble-out); border-top-right-radius: 4px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #9aa3ad; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .row, .panel { animation: none; } .typing i { animation: none; opacity: .6; } }
  .choices { display: flex; gap: 12px; justify-content: center; margin: 20px 0 4px; }
  .btn { appearance: none; border: 0; cursor: pointer; min-height: 48px; padding: 10px 22px; border-radius: 999px; font-size: 18px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn.primary { background: var(--accent); color: #fff; } .btn.primary:active { background: var(--accent-dark); }
  .btn.ghost { background: #fff; color: var(--text); }
  .choices .btn { flex: 1 1 0; max-width: 200px; white-space: nowrap; padding: 10px 16px; }
  .choices .btn.wide { max-width: 360px; }
  .panel { background: #fff; border-radius: 16px; padding: 16px; margin-top: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.12); animation: pop .35s ease-out both; }
  .panel h2 { font-size: 18px; margin: 0 0 8px; }
  .panel .note { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
  footer { text-align: center; font-size: 13px; color: #fff; padding: 8px 16px 32px; }
  footer a { color: #fff; }
</style>
</head>
<body>
  <header>
    <span class="name">クリーニングBASE</span>
    <button type="button" class="reset" id="reset">選び直し</button>
  </header>
  <main>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="choices" id="choices" hidden>
      <button type="button" class="btn primary" id="yes">はい</button>
      <button type="button" class="btn ghost" id="no">いいえ</button>
    </div>
    <div class="choices" id="toForm" hidden>
      <a class="btn primary wide" id="goForm" href="https://script.google.com/macros/s/AKfycbyaQ5tsrLVK8zP-rTS01p_1P6j6OS4wWdLY4p78uB6ial2TBqlRB9iNvO_6KJoK9V05/exec">ご予約フォームへ進む</a>
    </div>
    <div class="choices" id="noNext" hidden>
      <button type="button" class="btn primary" id="yesAfter">やっぱり予約する</button>
      <a class="btn ghost" id="backLp" href="https://8dfe7.hp.peraichi.com/">ページに戻る</a>
    </div>
  </main>
  <footer>クリーニングBASE</footer>
<script>
(function () {
  var FORM_URL = 'https://script.google.com/macros/s/AKfycbyaQ5tsrLVK8zP-rTS01p_1P6j6OS4wWdLY4p78uB6ial2TBqlRB9iNvO_6KJoK9V05/exec';
  var MSG = {
    first: 'ご覧いただきありがとうございます。エアコンクリーニングのご予約でよろしいですか？',
    yes: 'お手数をお掛けしますが、ご予約フォームへのご入力をお願いできますでしょうか？',
    no: 'ごゆっくりご覧ください。ご予約はいつでもこちらからどうぞ。'
  };

  // 流入元（utm_* など）はフォームの住所にもそのまま渡す（英数字と . _ - だけ、各40字）
  var q = new URLSearchParams(location.search), pass = new URLSearchParams();
  ['src', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
    var v = (q.get(k) || '').replace(/[^A-Za-z0-9._-]/g, '').slice(0, 40); if (v) pass.set(k, v);
  });
  var formUrl = FORM_URL + (pass.toString() ? '?' + pass.toString() : '');

  // 計測：ページ表示・はい・いいえ・フォーム表示を dataLayer に積む（タグマネージャを入れたら拾える）
  window.dataLayer = window.dataLayer || [];
  function track(name) { try { dataLayer.push({ event: 'cb_chat_' + name, cb_src: pass.toString() }); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var chat = $('chat'), timers = [];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function addRow(side, text) {
    var row = document.createElement('div');
    row.className = 'row ' + side;
    if (side === 'in') { var a = document.createElement('div'); a.className = 'avatar'; a.setAttribute('aria-hidden', 'true'); a.textContent = 'BASE'; row.appendChild(a); }
    var b = document.createElement('div'); b.className = 'bubble';
    if (text == null) b.innerHTML = '<span class="typing" aria-label="入力中"><i></i><i></i><i></i></span>'; else b.textContent = text;
    row.appendChild(b); chat.appendChild(row);
    row.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    return b;
  }
  function say(text, then) {
    var b = addRow('in', null);
    later(function () { b.textContent = text; if (then) then(); }, reduce ? 0 : 900);
  }
  function hideAll() { ['choices', 'toForm', 'noNext'].forEach(function (id) { $(id).hidden = true; }); }
  function start() {
    timers.forEach(clearTimeout); timers = [];
    chat.innerHTML = ''; hideAll();
    later(function () { say(MSG.first, function () { $('choices').hidden = false; }); }, reduce ? 0 : 300);
  }
  function yes() {
    hideAll(); track('yes'); addRow('out', 'はい');
    say(MSG.yes, function () { $('toForm').hidden = false; });
  }
  $('yes').addEventListener('click', yes);
  $('yesAfter').addEventListener('click', yes);
  $('no').addEventListener('click', function () {
    hideAll(); track('no'); addRow('out', 'いいえ');
    say(MSG.no, function () { $('noNext').hidden = false; });
  });
  // 予約フォーム（Google Apps Script）は、ほかのページの中に埋め込むと表示されない設定のため、同じ画面でフォームへ移る
  $('goForm').href = formUrl;
  $('goForm').addEventListener('click', function () { track('form_open'); });
  $('reset').addEventListener('click', start);
  track('view');
  start();
})();
</script>
</body>
</html>
