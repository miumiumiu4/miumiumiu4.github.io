<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="アライくん">
  <!-- アライくん（アライグマ）：クリーニングBASEの会話係 -->
  <circle cx="50" cy="50" r="50" fill="#fff4e8"/>
  <!-- 耳 -->
  <ellipse cx="24" cy="26" rx="13" ry="14" fill="#7a7f87"/>
  <ellipse cx="76" cy="26" rx="13" ry="14" fill="#7a7f87"/>
  <ellipse cx="24" cy="28" rx="7" ry="8" fill="#f2c9b8"/>
  <ellipse cx="76" cy="28" rx="7" ry="8" fill="#f2c9b8"/>
  <!-- 顔 -->
  <ellipse cx="50" cy="56" rx="36" ry="32" fill="#9aa0a8"/>
  <!-- おでこの白 -->
  <path d="M50 30 C44 38 44 44 50 48 C56 44 56 38 50 30 Z" fill="#ffffff"/>
  <!-- 白いほお -->
  <ellipse cx="50" cy="70" rx="24" ry="16" fill="#ffffff"/>
  <!-- 黒いマスク -->
  <path d="M16 54 C22 42 38 42 47 52 C40 62 26 64 16 54 Z" fill="#2b2f36"/>
  <path d="M84 54 C78 42 62 42 53 52 C60 62 74 64 84 54 Z" fill="#2b2f36"/>
  <!-- 目 -->
  <circle cx="33" cy="53" r="5" fill="#fff"/>
  <circle cx="67" cy="53" r="5" fill="#fff"/>
  <circle cx="34" cy="54" r="2.8" fill="#1f2328"/>
  <circle cx="66" cy="54" r="2.8" fill="#1f2328"/>
  <!-- 鼻と口 -->
  <ellipse cx="50" cy="64" rx="5" ry="3.6" fill="#1f2328"/>
  <path d="M44 71 Q50 76 56 71" stroke="#1f2328" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- ほっぺ -->
  <circle cx="30" cy="70" r="4" fill="#ffb8a8" opacity=".8"/>
  <circle cx="70" cy="70" r="4" fill="#ffb8a8" opacity=".8"/>
  <!-- 泡（お掃除） -->
  <circle cx="86" cy="80" r="6" fill="#bfe6ff" stroke="#7cc4ef" stroke-width="1.5"/>
  <circle cx="92" cy="70" r="3.5" fill="#bfe6ff" stroke="#7cc4ef" stroke-width="1.2"/>
</svg>
