<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>無料コンサル ご招待｜ありがとうグループ</title>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
<!-- 加盟前の無料音声で、先月たくさん聞いた上位3名だけに届く無料コンサルの招待ページ（11/23 さとぴー：Canva の豪華な見本・エイミーとの会話）。
     住所は推測できない名前（スキル unguessable-links）。招待されていない端末で開くと、案内だけ出す。 -->
<style>
:root{--bg:#07070b;--gold:#d9b46a;--gold2:#f3dca0;--line:rgba(217,180,106,.55);--text:#f6efe2;--muted:#c9bda3;--blue:#1f4f8f}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:17px;line-height:1.8;min-height:100vh;
background:radial-gradient(700px 420px at 50% -10%,rgba(217,180,106,.18),transparent 60%),radial-gradient(circle,rgba(243,220,160,.10) 1px,transparent 1.5px) 0 0/26px 26px,linear-gradient(180deg,#0b0b12,#05050a);background-attachment:fixed}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 30px}
.frame{position:relative;border:1px solid var(--line);padding:22px 16px 20px;box-shadow:0 0 0 4px rgba(7,7,11,.9),0 0 0 5px rgba(217,180,106,.35),0 0 40px rgba(217,180,106,.12) inset}
.frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold)}
.frame::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.frame::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.top{text-align:center}
.gift{font-size:46px;line-height:1;filter:drop-shadow(0 0 10px rgba(243,220,160,.5))}
.grp{margin-top:6px;font-size:14px;color:var(--muted);letter-spacing:.12em}
h1{margin:4px 0 6px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(24px,7.6vw,40px);font-weight:700;letter-spacing:.04em;white-space:nowrap;
background:linear-gradient(180deg,#fff4cf,var(--gold) 60%,#a8823b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;font-size:15px;color:var(--text)}
.rule{height:1px;margin:14px auto 16px;width:70%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
ol.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg img{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--gold);box-shadow:0 0 10px rgba(217,180,106,.35)}
.who{display:block;font-size:12px;color:var(--gold2);margin-bottom:2px}
.bot p{margin:0;background:linear-gradient(180deg,#fff9ea,#f3e6c6);color:#2a2215;padding:10px 14px;border-radius:4px 16px 16px 16px;border:1px solid var(--gold);max-width:86%}
.me{justify-content:flex-end}
.me p{margin:0;background:linear-gradient(180deg,#24548f,#173a66);color:#fff;padding:9px 14px;border-radius:16px 4px 16px 16px;border:1px solid #5b86c4;max-width:80%}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#a8823b;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chips{display:flex;flex-direction:column;gap:8px;padding-left:54px}
.chips button{font:inherit;font-size:16px;font-weight:700;color:var(--gold2);background:rgba(10,10,16,.9);border:1px solid var(--gold);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left}
.chips button:disabled{opacity:.35;cursor:default}
.chips button.on{opacity:1;background:rgba(217,180,106,.18)}
.go{display:none;margin:20px 0 6px;text-align:center}
.go.on{display:block}
.go a{display:block;padding:16px;font-size:20px;font-weight:900;color:#2a2215;text-decoration:none;letter-spacing:.04em;
background:linear-gradient(180deg,#fff0c4,var(--gold) 55%,#b48c42);border:1px solid #fff0c4;border-radius:8px;box-shadow:0 0 22px rgba(217,180,106,.45)}
.go{--bk-line:#d9b46a;--bk-bg:rgba(10,10,16,.9);--bk-fg:#f3dca0;--bk-on:#8a6a2c;--bk-btn:linear-gradient(180deg,#fff0c4,#d9b46a 55%,#b48c42);--bk-btnfg:#2a2215;text-align:left}
.go a small{display:block;font-size:14px;font-weight:700;letter-spacing:0}
.note{margin:14px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.no{display:none;text-align:center;font-size:15px;color:var(--muted)}
.no.on{display:block}
.no a{color:var(--gold2)}
footer{margin-top:22px;text-align:center;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<div class="frame">
  <div class="top">
    <div class="gift" aria-hidden="true">🎁</div>
    <div class="grp">ありがとうグループ</div>
    <h1>無料コンサル ご招待</h1>
    <p class="lead">先月たくさん聞いてくださったあなたへ。<br>三浦から30分のプレゼントです</p>
  </div>
  <div class="rule"></div>
  <ol class="log" id="log" aria-live="polite"></ol>
  <div class="go" id="go"><div id="bookbox"></div></div>
  <p class="no" id="no">このページは、加盟前の毎朝の音声で、先月たくさん聞いてくださった方へのご招待です。<br>音声を聞いた端末（スマホ）で開いてください。<br><a href="../0hy0tt09hxl8/">毎朝の音声へ</a></p>
  <p class="note">このページは招待された方だけのものです。</p>
</div>
<footer>© 2026 ありがとうグループ</footer>
</div>
<script src="../js/booking.js"></script>
<script>try{Booking.prefetch('consult')}catch(e){}</script>
<script>
(function(){
// 予約の飛び先（今は個別面談の予約ページ。無料コンサル用ができたらここを変える）
var BOOK='https://fc.arigatouosouji.com/event/LcRhtJ6KWNXu/register?utm_source=audio&utm_medium=page&utm_campaign=kamei-consult&utm_content=consult';
var LOG_URL='https://script.google.com/macros/s/AKfycbyjq5rAjICCnAw_Pk3E41vb7xdrbSACEwHbQ1pNUlK8h4WSvU16ZEasUd0r0wR50oYD/exec';
function get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
var name=get('kamei_name'),log=document.getElementById('log'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bot(html){return new Promise(function(done){var li=document.createElement('li');li.className='msg bot';
 li.innerHTML='<img src="../img/aimy.svg" alt="" width="44" height="44"><div><span class="who">エイミー</span><p class="dots" aria-label="入力中"><i></i><i></i><i></i></p></div>';
 log.appendChild(li);setTimeout(function(){li.querySelector('div').innerHTML='<span class="who">エイミー</span><p>'+html+'</p>';done()},reduce?0:650)})}
function me(t){var li=document.createElement('li');li.className='msg me';li.innerHTML='<p>'+esc(t)+'</p>';log.appendChild(li)}
function chips(list){return new Promise(function(done){var li=document.createElement('li');li.className='chips';
 li.innerHTML=list.map(function(c,i){return '<button type="button" data-i="'+i+'">'+esc(c)+'</button>'}).join('');
 li.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var c=list[Number(b.getAttribute('data-i'))];
  [].forEach.call(li.querySelectorAll('button'),function(x){x.disabled=true;x.classList.toggle('on',x===b)});me(c);done(c)});log.appendChild(li)})}
function send(topic,stage){try{var body=JSON.stringify({kind:'consult',n:name,topic:topic,stage:stage});
 if(!(navigator.sendBeacon&&navigator.sendBeacon(LOG_URL,new Blob([body],{type:'text/plain'}))))fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:body})}catch(e){}}
var topic='',stage='';
function talk(){
 bot('おめでとうございます！ 先月、音声をたくさん聞いてくださった上位3名に選ばれました🎁')
 .then(function(){return bot('30分、三浦があなたのためだけにお話しします。いくつか教えてください。')})
 .then(function(){return bot('いま、いちばん聞きたいことはどれですか？')})
 .then(function(){return chips(['お金・始め方','集客・人のこと','迷っていて決められない','そのほか（当日お話しします）'])})
 .then(function(c){topic=c;return bot('ありがとうございます。いまの状況に近いのはどれですか？')})
 .then(function(){return chips(['会社などに勤めている','独立して1年未満','独立して1年以上'])})
 .then(function(c){stage=c;if(!PREVIEW)send(topic,stage);return bot('ありがとうございます。三浦にお伝えしておきます。では、ご都合のいい日時を選んでください。')})
 .then(function(){var g=document.getElementById('go');g.classList.add('on');
  Booking.mount(document.getElementById('bookbox'),{type:'consult',note:'聞きたいこと：'+topic+'／今の状況：'+stage,nick:name,preview:PREVIEW,onDone:function(){bot('ご予約ありがとうございます！ 当日、三浦があなたのためだけにお話しします🎁')}});
  g.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})});
}
// ?preview=1：見本として会話を流す（記録・招待には何も残さない）
var PREVIEW=/[?&]preview=1(&|$)/.test(location.search);
if(PREVIEW){talk();return}
// 招待されているかを確かめる（招待されていなければ案内だけ）
if(!name){document.getElementById('no').classList.add('on');return}
try{fetch(LOG_URL+'?rank=1&n='+encodeURIComponent(name)).then(function(r){return r.json()}).then(function(j){if(j.invite)talk();else document.getElementById('no').classList.add('on')})
 .catch(function(){document.getElementById('no').classList.add('on')})}catch(e){document.getElementById('no').classList.add('on')}
})();
</script>
</body>
</html>
