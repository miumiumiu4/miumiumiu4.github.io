<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>個別面談のご予約｜ありがとうグループ</title>
<!-- 個別面談の予約ページ（11/23 さとぴー：UTAGE の予約の代わりに自作。三浦さんの Google カレンダーの空きから選ぶ）。
     加盟前の音声ページの「個別面談で相談する」ボタンと、資料請求した方へのメールから来る。住所は推測できない名前。 -->
<style>
:root{--bg:#02060f;--blue:#2fb8ff;--blue2:#0a6cff;--glow:rgba(47,184,255,.55);--text:#f2f8ff;--muted:#a9c3de;--line:rgba(47,184,255,.45)}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:17px;line-height:1.8;min-height:100vh;
background:radial-gradient(900px 500px at 85% 0%,rgba(10,108,255,.35),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(10,108,255,.28),transparent 60%),radial-gradient(circle,rgba(47,184,255,.12) 1px,transparent 1.5px) 0 0/22px 22px,var(--bg);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 28px}
header{padding-bottom:14px;border-bottom:1px solid var(--line)}
header .grp{font-size:14px;color:var(--muted);letter-spacing:.06em}
header h1{margin:2px 0 0;font-size:clamp(24px,6.6vw,32px);font-weight:900;letter-spacing:.04em;text-shadow:0 0 16px rgba(47,184,255,.35)}
header p{margin:4px 0 0;font-size:15px;color:var(--muted)}
ol.log{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg img{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 0 10px var(--glow)}
.who{display:block;font-size:12px;color:var(--blue);margin-bottom:2px}
.bot p{margin:0;background:rgba(6,22,48,.92);border:1px solid var(--line);padding:10px 14px;border-radius:4px 16px 16px 16px;max-width:86%}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--blue);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
#book{margin-top:6px;padding:4px 16px 18px;border:1px solid var(--line);border-radius:6px;background:rgba(3,12,28,.75);display:none}
#book.on{display:block}
footer{margin-top:26px;text-align:center;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header><div class="grp">ありがとうグループ</div><h1>個別面談のご予約</h1><p>オンライン（Zoom）・60分</p></header>
<ol class="log" id="log" aria-live="polite"></ol>
<div id="book"></div>
<footer>© 2026 ありがとうグループ</footer>
</div>
<script src="../js/booking.js"></script>
<script>try{Booking.prefetch('mendan')}catch(e){}</script>
<script>
(function(){
var log=document.getElementById('log'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var PREVIEW=/[?&]preview=1(&|$)/.test(location.search);
function get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function bot(html){return new Promise(function(done){var li=document.createElement('li');li.className='msg bot';
 li.innerHTML='<img src="../img/aimy.svg" alt="" width="44" height="44"><div><span class="who">エイミー</span><p class="dots" aria-label="入力中"><i></i><i></i><i></i></p></div>';
 log.appendChild(li);setTimeout(function(){li.querySelector('div').innerHTML='<span class="who">エイミー</span><p>'+html+'</p>';done()},reduce?0:600)})}
bot('こんにちは、エイミーです。個別面談のご予約ページへようこそ。')
.then(function(){return bot('三浦が、あなたの今の状況と、開業したい地域のお話をうかがいます。')})
.then(function(){return bot('下から、ご都合のいい日にちと時間を選んでください。')})
.then(function(){var box=document.getElementById('book');box.classList.add('on');
 Booking.mount(box,{type:'mendan',nick:get('kamei_name'),preview:PREVIEW,onDone:function(){bot('ご予約ありがとうございます！ 当日、三浦とお話しできるのを楽しみにしています。')}})});
})();
</script>
</body>
</html>
