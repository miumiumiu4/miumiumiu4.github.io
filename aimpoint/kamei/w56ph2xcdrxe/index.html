<style>

.btn.main{background:var(--orange)}.ask button.lg{font-size:18px;min-height:56px;padding:10px 20px;border-width:3px}.ask button.sm{font-size:14px;min-height:42px;border-width:1px}

.note{font-size:12.5px;color:var(--soft);margin:2px 0 12px 50px}

.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px 50px;font-size:14px}.flow span{background:#0f315c;border:1px solid var(--line);border-radius:6px;padding:4px 10px}.flow span:last-child{background:var(--orange);border-color:var(--orange);font-weight:700}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}.row output{font-size:22px;font-weight:800;color:var(--orange)}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.seg button{font:inherit;font-size:14px;min-height:40px;flex:1 1 auto;border:1px solid var(--soft);border-radius:6px;background:transparent;color:var(--white);cursor:pointer;padding:0 10px}
.seg button[aria-pressed=true]{background:var(--orange);border-color:var(--orange);font-weight:700}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.sc div{background:var(--white);color:var(--navy);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:0}.sc div.o{background:var(--orange);color:var(--white)}.sc strong{display:block;font-size:20px;line-height:1.3;white-space:nowrap}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:86px;align-items:end;margin-top:10px;font-size:10px;text-align:center}.bars i{display:block;background:var(--orange);border-radius:2px 2px 0 0;min-height:2px;transition:height .3s}
.hl{outline:3px solid var(--cream);outline-offset:3px;border-radius:6px}
.tb{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--soft);font-weight:400}td.l,th.l{text-align:left}tr.new td{background:#143a6b}
.hb{display:grid;grid-template-columns:8.5em 1fr 6.5em;gap:8px;align-items:center;font-size:13px;margin-top:4px}.hb i{height:14px;background:var(--orange);border-radius:3px;min-width:2px;transition:width .4s}.hb span:last-child{text-align:right}
.goal{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:4px 0 2px}.goal i{display:block;height:100%;background:var(--orange);transition:width .4s}
.play{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{min-height:42px;font-size:15px}
footer{color:var(--soft);font-size:12.5px;padding-bottom:30px}

051830;margin:0}.cl .fv{max-width:100%}.bub{height:104px;overflow:hidden}.bub .b{margin:0;animation:fade .35s ease-out}.bub .b>div{font-size:18px;font-weight:700;line-height:1.45;padding:8px 12px}.bub .b b{color:#c25600;font-weight:900}@keyframes fade{from{opacity:0}to{opacity:1}}@media(min-width:760px){.cl{grid-template-columns:minmax(0,340px) minmax(0,1fr)}.cl.ph{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bub{height:auto;max-height:430px;display:flex;flex-direction:column;justify-content:flex-start}.bub .b{margin:0 0 10px}}@media(max-width:400px){.bub .b>i{width:32px;height:32px}}.gap{font-size:22px!important;font-weight:900;line-height:1.3!important}.sub2{margin:0 0 6px;font-size:14px;color:inherit;opacity:.85}.pt{font-size:12.5px;color:var(--soft);margin-top:2px}
.fr{margin:0 0 14px 50px}.fr label{font-size:14px;color:var(--soft)}.fr textarea{width:100%;font:inherit;border-radius:8px;border:1px solid var(--soft);padding:8px 10px;background:var(--white);color:var(--navy);display:block;margin-top:4px}.fr .ask{margin-left:0}
.vl{display:grid;gap:10px;margin:4px 0 16px 50px}.vd{font:inherit;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--white);color:var(--navy);border:2px solid var(--white);border-radius:10px;padding:8px 14px 8px 8px;cursor:pointer}.vp{width:52px;height:52px;border-radius:8px;background:var(--navy);color:var(--white);display:grid;place-items:center;font-size:20px}.vt{font-weight:700}.vm{font-size:12.5px;color:#4a5d78;white-space:nowrap}.vd.seen .vp{background:var(--orange)}
.fv{background:#000;border-radius:8px;aspect-ratio:16/9;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;margin-top:8px}.vl2{font-size:12px;color:var(--soft);margin-bottom:auto}.face{position:absolute;right:14px;bottom:14px;width:84px;height:84px;border-radius:50%;border:4px solid var(--orange);background:#0f315c;display:grid;place-items:center;font-weight:800}.fv{position:relative}.vc{padding-right:104px;font-size:17px;font-weight:700;line-height:1.6;text-shadow:0 1px 3px #000}
footer details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}footer summary{cursor:pointer}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 案1の色（ほぼ黒の紺・冷たい水色の光・あたたかいオレンジの光・細い大きな見出し・角を切ったパネル）× 案3の形（光る枠の問い・左に丸のある縦の選択肢・下線の行・光る枠の丸いボタン・細い格子） */
:root{color-scheme:dark;--navy:#04050d;--deep:#070a16;--line:rgba(140,200,255,.22);--orange:#ff7a2a;--dark:#ff9a52;--cream:#0b1222;--white:#eef3ff;--soft:#9fb4cf;--ice:#7fd3ff}
body{background:#04050d;color:#eef3ff;font-size:18px;line-height:1.75}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(rgba(127,211,255,.045) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(127,211,255,.045) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(circle at 85% 10%,rgba(63,140,220,.18),transparent 45%),radial-gradient(circle at 10% 95%,rgba(255,122,42,.12),transparent 40%)}
header{background:rgba(4,5,13,.92);border-bottom:1px solid rgba(127,211,255,.35);backdrop-filter:blur(8px)}
.brand{color:#9fb4cf}.brand button{border-color:rgba(127,211,255,.5);color:#cfe6ff}
.goal{background:rgba(255,255,255,.08)}.goal i{background:linear-gradient(90deg,#7fd3ff,#ff7a2a);box-shadow:0 0 10px rgba(255,122,42,.7)}
h2{font-weight:300;font-size:24px;letter-spacing:.02em;border-left:0;padding-left:0;color:#f4f8ff}

.b>i{background:transparent!important;color:#ff9a52;border:2px solid #ff7a2a;box-shadow:0 0 12px rgba(255,122,42,.6),inset 0 0 8px rgba(255,122,42,.35)}
.b>div{background:rgba(9,14,28,.88);color:#eef3ff;border:1.5px solid rgba(255,122,42,.75);border-radius:14px;box-shadow:0 0 14px rgba(255,122,42,.22);font-size:18px}
.b b{color:#ffab6b}
.me span{background:linear-gradient(135deg,rgba(255,122,42,.95),rgba(255,84,0,.9));color:#fff;box-shadow:0 0 16px rgba(255,122,42,.55);border-radius:14px 4px 14px 14px}
.ask{flex-direction:column;flex-wrap:nowrap;gap:2px;margin-left:50px}
.ask button,.ask button:first-child{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;background:transparent!important;border:0;border-bottom:1px solid rgba(200,220,255,.28);border-radius:0;padding:8px 6px 8px 0;color:#eef3ff;font-size:17.5px;font-weight:700;overflow:hidden}
.ask button::before{content:"";flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #ff7a2a;box-shadow:0 0 10px rgba(255,122,42,.55),inset 0 0 6px rgba(255,122,42,.3);transition:background .2s}
.ask button.lg{font-size:19.5px;color:#fff}.ask button.lg::before{width:36px;height:36px;border-color:#ff9a52}

 e20:{src:"media/e20.mp4?v=1127d",voice:1,len:"108.5秒",place:"人数＝20人：20人がそろった年（最後は6割の問い）",cue:[[0,"20人、と選ばれましたね。"],[4.1,"では、20人のお店を見てみます。"],[7.81,"前提は、1月に1人で始めて、月に2人ずつ、スタッフを増やす形です。"],[16.19,"そうすると、10か月目に、20人がそろいます。"],[21.28,"ここで見るのは、20人が、1年じゅうそろった年です。"],[26.75,"あなたも現場に出て、毎月の費用と経費を引いた、税金を払う前の残りで見ます。"],[33.63,"売上は、1億4,280万円。"],[37.98,"残るのは、およそ4,370万円。"],[43.03,"月にならすと、約364万円です。"],[48.16,"ただ、ここまで来ると、増やすのは、人ではありません。"],[54.54,"教える人です。"],[55.9,"20人に、あなたひとりで、全部を教えることは、できません。"],[60.25,"自動車の教習所を、思い出してください。"],[63.54,"生徒が増えたとき、校長先生が、全員のとなりに乗ることは、ありませんよね。"],[70.14,"教習所は、先生を増やします。"],[72.85,"お店も、同じです。"],[74.75,"まず、ひとりを、教えられる人に育てる。"],[78.82,"その人が、次の人を教える。"],[81.96,"先生が増えるほど、人は、無理なく増やせます。"],[85.82,"そして、教えるのは、体力ではありません。"],[89.52,"自分が、どこでつまずいて、どう直したか。"],[93.29,"覚えている人ほど、良い先生になれます。"],[96.66,"数字は例で、同じ結果を、お約束するものではありません。"],[101.42,"では、もし計画の6割しか仕事が入らなかったら、どうなるでしょう？"]]},
