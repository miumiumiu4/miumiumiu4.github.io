<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>朝の5分 7日目「振り返る人ほど前に進む」｜エイムポイント</title>
<style>
:root{--ink:#1f3b2d;--ink2:#2c5240;--paper:#f7f4ec;--soft:#ffffff;--line:#d9d3c3;--text:#23302a;--muted:#5a6660;--accent:#c98a2b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:18px;line-height:1.8;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;text-align:center;padding:22px 16px;font-size:26px;font-weight:700;letter-spacing:.06em}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:56px 16px 64px}
.card{background:linear-gradient(160deg,var(--ink2),var(--ink));border:0;border-radius:14px;box-shadow:0 6px 20px rgba(31,59,45,.18);color:#fff;text-align:center;aspect-ratio:600/262;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px}
.card .no{font-size:18px;font-weight:700;letter-spacing:.08em;color:#f2d9a6}
.card .ttl{font-size:clamp(22px,5.4vw,30px);font-weight:700;margin-top:8px;line-height:1.4}
.player{margin-top:24px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer}
.play svg{width:20px;height:20px;fill:#fff}
.bar{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,#e6e1d4;outline:none}
.bar::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer}
.bar::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink)}
.time{flex:none;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rate{flex:none;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:6px 12px;cursor:pointer;min-width:52px}
.note{margin-top:40px;font-size:15px;color:var(--muted);line-height:1.9}
.note p{margin:0 0 6px}
footer{background:var(--ink);color:#fff;padding:28px 16px}
footer .in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
footer .name{font-size:18px;font-weight:700}
footer small{font-size:14px;opacity:.85}
@media (max-width:480px){.time{display:none}.player{gap:10px}main{padding-top:32px}}
</style>
</head>
<body>
<header>エイムポイント</header>
<main>
  <div class="card"><div class="no">朝の5分　7日目</div><div class="ttl">振り返る人ほど前に進む</div></div>
  <div class="player">
    <button class="play" id="play" aria-label="再生"><svg viewBox="0 0 24 24" id="ico"><path d="M7 4l14 8-14 8z"/></svg></button>
    <input class="bar" id="bar" type="range" min="0" max="1000" value="0" aria-label="再生位置">
    <span class="time" id="time">0:00 / -:--</span>
    <button class="rate" id="rate" aria-label="再生速度">1×</button>
  </div>
  <audio id="a" preload="metadata" src="../mp3/day07.mp3"></audio>
  <div class="note">
    <p>※こちらの音声は、講座にお申し込みいただいた方にお届けしているものです。</p>
    <p>録音・転載・複製・第三者への共有や、SNS等への公開はご遠慮ください。</p>
    <p>皆さまに安心して聞いていただくため、ご理解とご協力をお願いいたします。</p>
  </div>
</main>
<footer><div class="in"><div class="name">エイムポイント</div><small>© 2026 AimPoint LLC</small></div></footer>
<script>
(function(){
var a=document.getElementById('a'),play=document.getElementById('play'),ico=document.getElementById('ico'),
bar=document.getElementById('bar'),time=document.getElementById('time'),rate=document.getElementById('rate');
var rates=[1,1.25,1.5,2,0.75],ri=0,seeking=false;
function f(s){if(!isFinite(s))return'-:--';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function draw(){var d=a.duration||0,c=a.currentTime||0;time.textContent=f(c)+' / '+f(d);
 if(!seeking&&d){bar.value=Math.round(c/d*1000)}bar.style.setProperty('--p',(bar.value/10)+'%')}
function icon(){ico.innerHTML=a.paused?'<path d="M7 4l14 8-14 8z"/>':'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';play.setAttribute('aria-label',a.paused?'再生':'一時停止')}
play.onclick=function(){a.paused?a.play():a.pause()};
a.addEventListener('play',icon);a.addEventListener('pause',icon);a.addEventListener('ended',icon);
a.addEventListener('timeupdate',draw);a.addEventListener('loadedmetadata',draw);
bar.addEventListener('input',function(){seeking=true;bar.style.setProperty('--p',(bar.value/10)+'%');if(a.duration)time.textContent=f(bar.value/1000*a.duration)+' / '+f(a.duration)});
bar.addEventListener('change',function(){if(a.duration)a.currentTime=bar.value/1000*a.duration;seeking=false});
rate.onclick=function(){ri=(ri+1)%rates.length;a.playbackRate=rates[ri];rate.textContent=rates[ri]+'×'};
})();
</script>
</body>
</html>
