<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>売上の入力フォーム</title>
<style>
body{margin:0}
/* 左＝1件の入力、右＝スプレッドシートが計算した結果。提案資料と同じ紺×オレンジ×白 */
:root{--navy:#082344;--line:#2b4a74;--orange:#f07a12;--cream:#fff1e3;--white:#fff;--soft:#b9c9de;--deep:#c25600;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--navy);color:var(--white);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5;font-variant-numeric:tabular-nums}
main{max-width:1180px;margin:0 auto;padding-block:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1{font-size:28px;margin:0;padding-bottom:10px;border-bottom:3px solid var(--orange);text-wrap:balance}
h2{font-size:17px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:28px;margin-top:18px}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:15px}
input,select,button{font:inherit;font-size:17px;min-height:44px;border-radius:6px;border:1px solid var(--soft);padding:0 12px}
input,select{background:var(--white);color:var(--navy);width:100%}
button{background:var(--orange);color:var(--white);border-color:var(--orange);font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
#status{min-height:24px;margin:0;font-size:14.5px;color:var(--soft)}
dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
dl div{background:var(--white);color:var(--navy);border-radius:8px;padding:10px 14px;min-width:0}
dl div.main{background:var(--orange);color:var(--white)}
dt{font-size:13.5px}dd{margin:0;font-size:24px;font-weight:800;white-space:nowrap}
.goal{margin:14px 0 18px;font-size:15px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--orange);width:0}
.wrap{overflow-x:auto;margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,.l{text-align:left}
th{color:var(--soft);font-weight:400}
a{color:var(--cream)}
.note{font-size:12.5px;color:var(--soft);margin:0}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}h1{font-size:22px}dl{grid-template-columns:1fr 1fr}}
</style></head><body>
<main>
<h1>入力するだけ。売上と粗利は自動で計算されます</h1>
<div class="grid">
<form id="f">
<h2>今日の1件を入れる</h2>
<label for="d">日付<input id="d" type="date" min="2027-05-01" max="2027-12-31" required></label>
<label for="w">担当<select id="w"><option>自分</option><option>スタッフA（見本）</option><option>スタッフB（見本）</option><option>スタッフC（見本）</option></select></label>
<label for="c">予約の入口<select id="c"><option>集客サイト</option><option>お客様リスト</option></select></label>
<label for="n">台数・件数<input id="n" type="number" min="1" max="20" value="1" required></label>
<label for="s">売上（円）<input id="s" type="number" min="0" max="500000" step="100" value="15000" required></label>
<button id="b" type="submit">スプレッドシートに入れる</button>
<p id="status" role="status">スプレッドシートを読んでいます</p>
</form>
<section aria-live="polite">
<dl><div><dt>売上</dt><dd id="r1">–</dd></div><div><dt>スタッフの報酬</dt><dd id="r2">–</dd></div><div><dt>広告費</dt><dd id="r3">–</dd></div><div class="main"><dt>粗利</dt><dd id="r4">–</dd></div></dl>
<div class="goal"><span id="goal">粗利330万円まで</span><div class="bar"><i id="bar"></i></div></div>
<h2>月ごと</h2><div class="wrap"><table><thead><tr><th>月</th><th>売上</th><th>報酬</th><th>広告費</th><th>粗利</th></tr></thead><tbody id="m"></tbody></table></div>
<h2>入れた記録（新しい5件）</h2><div class="wrap"><table><thead><tr><th>日付</th><th class="l">担当</th><th class="l">入口</th><th>件数</th><th>売上</th><th>粗利</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="note">見本です。だれでも試せます（1日50件まで。毎晩、見本の数字に戻ります）。粗利＝売上−スタッフの報酬−広告費（サイトの手数料を含む）。割合は見本です。同じ結果の約束ではありません。申告の帳簿や税金の計算は別に必要です。<a id="open" href="https://docs.google.com/spreadsheets/d/1VLcOrRDyhuQAljEL5F4m0mWEC0IlUClondBHjeIPf2s/edit">スプレッドシートを開く</a></p>
</section></div></main>
<script>
(function(){
var URL_="https://script.google.com/macros/s/AKfycbwIfVLDtXR3P194_S2zM-OBh6kVJTHloUa6drJNNWlf07Cc7yG9UtJiF9dZaC7zaLZpMA/exec",$=function(i){return document.getElementById(i)};
var num=function(v){return Number(String(v==null?"":v).replace(/[^0-9.-]/g,""))||0},yen=function(v){return Math.round(num(v)).toLocaleString("ja-JP")+"円"};
function row(tb,cells,left){var tr=document.createElement("tr");cells.forEach(function(c,i){var td=document.createElement("td");td.textContent=c;if(left.indexOf(i)>=0)td.className="l";tr.appendChild(td)});tb.appendChild(tr)}
function show(o){
  var t=o.total;["r1","r2","r3","r4"].forEach(function(k,i){$(k).textContent=yen(t[i])});
  $("goal").textContent="粗利330万円まで、あと "+yen(Math.max(0,3300000-num(t[3])));$("bar").style.width=Math.max(0,Math.min(100,num(t[3])/33000))+"%";
  $("m").textContent="";o.months.filter(function(r){return num(r[1])>0}).forEach(function(r){row($("m"),[r[0],yen(r[1]),yen(r[2]),yen(r[3]),yen(r[4])],[])});
  $("rows").textContent="";o.rows.slice(-5).reverse().forEach(function(r){row($("rows"),[r[0],r[1],r[2],r[3],yen(r[4]),yen(r[7])],[1,2])});
}
function call(opt){return fetch(URL_,opt).then(function(r){return r.json()}).then(function(o){if(o.error)throw new Error(o.error);show(o)})}
$("d").value="2027-06-05";
call().then(function(){$("status").textContent="見本シートとつながっています"}).catch(function(){$("status").textContent="見本シートを読めませんでした。少し待って開き直してください"});
$("f").addEventListener("submit",function(ev){ev.preventDefault();
  $("b").disabled=true;$("status").textContent="見本シートに入れています";
  call({method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({date:$("d").value,who:$("w").value,route:$("c").value,n:Number($("n").value),sales:Number($("s").value)})})
    .then(function(){$("status").textContent="入りました。見本シートが計算し直しました"})
    .catch(function(e){$("status").textContent=/[ぁ-ん]/.test(e.message)?e.message:"つながりませんでした。見本シートに入ったか確かめてから、もう一度押してください"})
    .then(function(){$("b").disabled=false});
});
})();
</script></body></html>
